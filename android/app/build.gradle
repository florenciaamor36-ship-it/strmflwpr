def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { net ->
        localProperties.load(net)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    flutterRoot = System.getenv('FLUTTER_ROOT')
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "/packages/flutter_tools/gradle/flutter.gradle"
apply plugin: 'com.google.gms:google-services'

android {
    namespace "com.strmflwpr.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.strmflwpr.app"
        minSdk 21
        targetSdk 34
        versionCode (localProperties.getProperty('flutter.versionCode') ?: '1').toInteger()
        versionName (localProperties.getProperty('flutter.versionName') ?: '1.0')
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'androidx.multidex:multidex:2.0.1'
}
