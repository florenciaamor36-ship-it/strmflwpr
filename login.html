<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0c29">
    <title>Acceso | StreamFlow Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { width: 100%; max-width: 400px; background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        h2 { text-align: center; margin-bottom: 5px; }
        h2 span { color: #f5af19; }
        p.subtitle { text-align: center; font-size: 0.8rem; opacity: 0.6; margin-bottom: 30px; }
        .hidden { display: none; }
        #error-msg { color: #ff6b6b; font-size: 0.75rem; margin-top: 10px; text-align: center; min-height: 1rem; }
        .toggle-auth { text-align: center; margin-top: 20px; font-size: 0.8rem; opacity: 0.8; }
        .toggle-auth span { color: #f5af19; cursor: pointer; font-weight: 600; }
        .loader { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; display: none; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>StreamFlow <span>Pro</span></h2>
        <p class="subtitle">Gestión Profesional de Streaming</p>

        <!-- LOGIN VIEW -->
        <div id="login-view">
            <input type="email" id="login-email" class="input" placeholder="Email">
            <input type="password" id="login-pass" class="input" placeholder="Contraseña">
            <button id="btn-login" class="button-submit">
                <span id="login-text">Iniciar Sesión</span>
                <div id="login-loader" class="loader"></div>
            </button>
            <p class="toggle-auth">¿No tienes cuenta? <span onclick="toggleAuth()">Regístrate</span></p>
        </div>

        <!-- REGISTER VIEW -->
        <div id="register-view" class="hidden">
            <input type="email" id="reg-email" class="input" placeholder="Email">
            <input type="password" id="reg-pass" class="input" placeholder="Contraseña (mín. 6)">
            <button id="btn-register" class="button-submit">
                <span id="reg-text">Crear Cuenta</span>
                <div id="reg-loader" class="loader"></div>
            </button>
            <p class="toggle-auth">¿Ya tienes cuenta? <span onclick="toggleAuth()">Inicia sesión</span></p>
        </div>

        <div id="error-msg"></div>
    </div>

    <script src="login-logic.js"></script>
</body>
</html>
