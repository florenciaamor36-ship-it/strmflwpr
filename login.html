<!DOCTYPE html>
<html lang="es">
<head>
    
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-content">

  <meta name="apple-mobile-web-app-title" content="Nexus IA">
  <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f5af19'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='%23000'%3E🎬%3C/text%3E%3C/svg%3E">
  <title>Nexus IA | Gestión Profesional de Streaming</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <link rel="stylesheet" href="nexus.css">

    <style>
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #6366f1; }
    input:checked + .slider:before { transform: translateX(20px); }
    </style>
    
    <title>StreamFlow Pro | Acceso</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0f0c29; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-wrapper { display: flex !important; width: 100%; max-width: 400px; padding: 20px; }
        .form { width: 100%; }
    </style>
</head>
<body>
    <div class="login-wrapper" id="loginWrapper">
    <div class="form">
      <div style="text-align:center; margin-bottom:1rem;">
        <div style="width:55px; height:55px; background:linear-gradient(145deg,#f5af19,#f12711); border-radius:18px; display:flex; align-items:center; justify-content:center; margin:0 auto 0.6rem auto;">
          <i class="fas fa-gem" style="font-size:1.8rem; color:#fff;"></i>
        </div>
        <h2 style="font-size:1.4rem; font-weight:800; background:linear-gradient(135deg,#f5af19,#f12711); -webkit-background-clip:text; background-clip:text; color:transparent;">Nexus IA</h2>
        <p style="font-size:0.6rem; opacity:0.7; margin-top:0.2rem;">Gestión Profesional de Streaming</p>
      </div>

      <div id="loginPanel">
        <div class="flex-column"><label>Email</label></div>
        <div class="inputForm"><svg xmlns="http://www.w3.org/2000/svg" width="20" viewBox="0 0 32 32" height="20"><g><path d="m30.853 13.87a15 15 0 0 0 -29.729 4.082 15.1 15.1 0 0 0 12.876 12.918 15.6 15.6 0 0 0 2.016.13 14.85 14.85 0 0 0 7.715-2.145 1 1 0 1 0 -1.031-1.711 13.007 13.007 0 1 1 5.458-6.529 2.149 2.149 0 0 1 -4.158-.759v-10.856a1 1 0 0 0 -2 0v1.726a8 8 0 1 0 .2 10.325 4.135 4.135 0 0 0 7.83.274 15.2 15.2 0 0 0 .823-7.455zm-14.853 8.13a6 6 0 1 1 6-6 6.006 6.006 0 0 1 -6 6z"></path></g></svg><input type="email" id="loginEmail" class="input" placeholder="correo@ejemplo.com"></div>
        
        <div class="flex-column"><label>Contraseña</label></div>
        <div class="inputForm" style="position:relative;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" viewBox="-64 0 512 512" height="20"><path d="m336 512h-288c-26.453125 0-48-21.523438-48-48v-224c0-26.476562 21.546875-48 48-48h288c26.453125 0 48 21.523438 48 48v224c0 26.476562-21.546875 48-48 48zm-288-288c-8.8125 0-16 7.167969-16 16v224c0 8.832031 7.1875 16 16 16h288c8.8125 0 16-7.167969 16-16v-224c0-8.832031-7.1875-16-16-16zm0 0"></path><path d="m304 224c-8.832031 0-16-7.167969-16-16v-80c0-52.929688-43.070312-96-96-96s-96 43.070312-96 96v80c0 8.832031-7.167969 16-16 16s-16-7.167969-16-16v-80c0-70.59375 57.40625-128 128-128s128 57.40625 128 128v80c0 8.832031-7.167969 16-16 16zm0 0"></path></svg>
          <input type="password" id="loginPassword" class="input" placeholder="contraseña" style="flex:1;">
          <button type="button" id="toggleLoginPassword" style="background:transparent; border:none; color:#f5af19; cursor:pointer; padding:0 12px; font-size:0.8rem;"><i class="fas fa-eye"></i></button>
        </div>
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin:5px 0;">
          <label style="display:flex; align-items:center; gap:5px; cursor:pointer; font-size:0.65rem;">
            <input type="checkbox" id="rememberMeCheckbox" style="width:16px; height:16px; margin:0;"> Recordarme
          </label>
          <span class="span" id="forgotPasswordBtn">¿Olvidaste tu contraseña?</span>
        </div>
        
        <button class="button-submit" id="btnLoginSubmit">Iniciar sesión</button>
        <p class="p">¿No tienes cuenta? <span class="span" id="showRegister">Regístrate aquí</span></p>
      </div>
      
      <div id="registerPanel" style="display: none;">
        <div class="flex-column"><label>Email</label></div>
        <div class="inputForm"><svg xmlns="http://www.w3.org/2000/svg" width="20" viewBox="0 0 32 32" height="20"><path d="m30.853 13.87a15 15 0 0 0 -29.729 4.082 15.1 15.1 0 0 0 12.876 12.918 15.6 15.6 0 0 0 2.016.13 14.85 14.85 0 0 0 7.715-2.145 1 1 0 1 0 -1.031-1.711 13.007 13.007 0 1 1 5.458-6.529 2.149 2.149 0 0 1 -4.158-.759v-10.856a1 1 0 0 0 -2 0v1.726a8 8 0 1 0 .2 10.325 4.135 4.135 0 0 0 7.83.274 15.2 15.2 0 0 0 .823-7.455zm-14.853 8.13a6 6 0 1 1 6-6 6.006 6.006 0 0 1 -6 6z"></path></svg><input type="email" id="regEmail" class="input" placeholder="correo@ejemplo.com"></div>
        
        <div class="flex-column"><label>Contraseña</label></div>
        <div class="inputForm" style="position:relative;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" viewBox="-64 0 512 512" height="20"><path d="m336 512h-288c-26.453125 0-48-21.523438-48-48v-224c0-26.476562 21.546875-48 48-48h288c26.453125 0 48 21.523438 48 48v224c0 26.476562-21.546875 48-48 48zm-288-288c-8.8125 0-16 7.167969-16 16v224c0 8.832031 7.1875 16 16 16h288c8.8125 0 16-7.167969 16-16v-224c0-8.832031-7.1875-16-16-16zm0 0"></path><path d="m304 224c-8.832031 0-16-7.167969-16-16v-80c0-52.929688-43.070312-96-96-96s-96 43.070312-96 96v80c0 8.832031-7.167969 16-16 16s-16-7.167969-16-16v-80c0-70.59375 57.40625-128 128-128s128 57.40625 128 128v80c0 8.832031-7.167969 16-16 16zm0 0"></path></svg>
          <input type="password" id="regPassword" class="input" placeholder="mínimo 6 caracteres" style="flex:1;">
          <button type="button" id="toggleRegPassword" style="background:transparent; border:none; color:#f5af19; cursor:pointer; padding:0 12px; font-size:0.8rem;"><i class="fas fa-eye"></i></button>
        </div>
        
        <div class="flex-column"><label>Confirmar contraseña</label></div>
        <div class="inputForm" style="position:relative;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" viewBox="-64 0 512 512" height="20"><path d="m336 512h-288c-26.453125 0-48-21.523438-48-48v-224c0-26.476562 21.546875-48 48-48h288c26.453125 0 48 21.523438 48 48v224c0 26.476562-21.546875 48-48 48zm-288-288c-8.8125 0-16 7.167969-16 16v224c0 8.832031 7.1875 16 16 16h288c8.8125 0 16-7.167969 16-16v-224c0-8.832031-7.1875-16-16-16zm0 0"></path><path d="m304 224c-8.832031 0-16-7.167969-16-16v-80c0-52.929688-43.070312-96-96-96s-96 43.070312-96 96v80c0 8.832031-7.167969 16-16 16s-16-7.167969-16-16v-80c0-70.59375 57.40625-128 128-128s128 57.40625 128 128v80c0 8.832031-7.167969 16-16 16zm0 0"></path></svg>
          <input type="password" id="regPasswordConfirm" class="input" placeholder="repite la contraseña" style="flex:1;">
          <button type="button" id="toggleRegConfirmPassword" style="background:transparent; border:none; color:#f5af19; cursor:pointer; padding:0 12px; font-size:0.8rem;"><i class="fas fa-eye"></i></button>
        </div>
        
        <button class="button-submit" id="btnRegisterSubmit">Registrarse</button>
        <p class="p">¿Ya tienes cuenta? <span class="span" id="showLogin">Inicia sesión</span></p>
      </div>
      
      <div id="authError" style="color:#ff6b6b; text-align:center; margin-top:10px; font-size:0.7rem;"></div>
      
      <div style="text-align:center; margin-top:1rem; padding-top:0.8rem; border-top:1px solid rgba(255,255,255,0.1); font-size:0.55rem; opacity:0.6;">
        by La Clave Argentina & Tienda SSH
      </div>
    </div>
  </div>
    
    <!-- We'll need a minimal app.js or a specialized login.js -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="login-logic.js"></script>
</body>
</html>
