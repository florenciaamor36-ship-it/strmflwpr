<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0c29">
    <title>Acceso | StreamFlow Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ajustes específicos para que la caja de login se vea centrada y premium */
        .login-wrapper {
            background: #0f0c29;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(48, 43, 99, 0.8) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(36, 36, 62, 0.9) 0%, transparent 50%),
                linear-gradient(180deg, #0f0c29 0%, #1a1a3e 100%);
        }
        .hidden { display: none !important; }
        #error-msg {
            color: #ff6b6b;
            font-size: 0.75rem;
            text-align: center;
            margin-top: 10px;
            min-height: 1rem;
        }
        .loader {
            width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="form">
            <div style="text-align:center; margin-bottom:1.5rem;">
                <div style="width:65px; height:65px; background:linear-gradient(145deg,#f5af19,#f12711); border-radius:20px; display:flex; align-items:center; justify-content:center; margin:0 auto 1rem auto; box-shadow: 0 8px 20px rgba(245,175,25,0.3);">
                    <i class="fas fa-gem" style="font-size:2rem; color:#fff;"></i>
                </div>
                <h2 style="font-size:1.6rem; font-weight:800; background:linear-gradient(135deg,#f5af19,#f12711); -webkit-background-clip:text; background-clip:text; color:transparent;">StreamFlow Pro</h2>
                <p style="font-size:0.7rem; opacity:0.7; margin-top:0.3rem; letter-spacing: 1px;">GESTIÓN PROFESIONAL</p>
            </div>

            <!-- Login View -->
            <div id="login-view">
                <div class="flex-column"><label>Email</label></div>
                <div class="inputForm">
                    <i class="fas fa-envelope" style="margin-left:15px; color:#f5af19;"></i>
                    <input type="email" id="login-email" class="input" placeholder="correo@ejemplo.com">
                </div>
                
                <div class="flex-column"><label>Contraseña</label></div>
                <div class="inputForm">
                    <i class="fas fa-lock" style="margin-left:15px; color:#f5af19;"></i>
                    <input type="password" id="login-pass" class="input" placeholder="tu contraseña">
                </div>

                <button id="btn-login" class="button-submit">
                    <span id="login-text">Entrar</span>
                    <div id="login-loader" class="loader"></div>
                </button>
                
                <p class="p">¿No tienes cuenta? <span class="span" onclick="toggleAuth()">Regístrate aquí</span></p>
            </div>

            <!-- Register View -->
            <div id="register-view" class="hidden">
                <div class="flex-column"><label>Email</label></div>
                <div class="inputForm">
                    <i class="fas fa-envelope" style="margin-left:15px; color:#f5af19;"></i>
                    <input type="email" id="reg-email" class="input" placeholder="tu@email.com">
                </div>
                
                <div class="flex-column"><label>Contraseña</label></div>
                <div class="inputForm">
                    <i class="fas fa-lock" style="margin-left:15px; color:#f5af19;"></i>
                    <input type="password" id="reg-pass" class="input" placeholder="Mínimo 6 caracteres">
                </div>

                <button id="btn-register" class="button-submit">
                    <span id="reg-text">Crear cuenta</span>
                    <div id="reg-loader" class="loader"></div>
                </button>
                
                <p class="p">¿Ya tienes cuenta? <span class="span" onclick="toggleAuth()">Inicia sesión</span></p>
            </div>

            <div id="error-msg"></div>

            <div style="text-align:center; margin-top:1.5rem; padding-top:1rem; border-top:1px solid rgba(255,255,255,0.1); font-size:0.6rem; opacity:0.5;">
                by La Clave Argentina & Tienda SSH
            </div>
        </div>
    </div>

    <script src="login-logic.js"></script>
</body>
</html>
