<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0c29" />
  <title>StreamFlow Pro | Gestión Profesional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%;font-family:Inter,system-ui,sans-serif;background:#0f0c29;color:#fff;overflow:hidden}
    body{display:flex;align-items:center;justify-content:center}
    .screen{width:100%;height:100%;display:flex;flex-direction:column}
    .login,.app{width:100%;height:100%;display:none}
    .login.active,.app.active{display:flex}
    .login{align-items:center;justify-content:center;padding:24px}
    .card{width:min(420px,100%);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:24px;backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
    h1{margin:0 0 8px;font-size:30px}
    p{margin:0 0 18px;color:rgba(255,255,255,.75)}
    .field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
    label{font-size:13px;color:rgba(255,255,255,.8)}
    input,button{font:inherit}
    input{width:100%;padding:14px 16px;border:none;border-radius:14px;background:rgba(255,255,255,.08);color:#fff;outline:none}
    input::placeholder{color:rgba(255,255,255,.45)}
    .btn{border:none;border-radius:14px;padding:14px 16px;background:linear-gradient(135deg,#f5af19,#f12711);color:#fff;font-weight:800;cursor:pointer;width:100%}
    .btn.secondary{background:rgba(255,255,255,.1)}
    .app{flex-direction:column}
    .topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(15,12,41,.9)}
    .brand{font-weight:800;font-size:20px}
    .badge{padding:8px 12px;border-radius:999px;background:rgba(245,175,25,.15);color:#f5af19;font-weight:700;font-size:12px}
    .content{flex:1;overflow:auto;padding:18px 18px 92px}
    .panel{display:none}
    .panel.active{display:block}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
    .stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px}
    .stat .k{font-size:12px;color:rgba(255,255,255,.65)}
    .stat .v{font-size:26px;font-weight:800;margin-top:6px}
    .box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;margin-bottom:14px}
    .nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#1a1a3e;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-around;align-items:center;display:none}
    .nav button{background:none;border:none;color:rgba(255,255,255,.75);display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
    .nav button.active{color:#f5af19}
    .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:12px 16px;border-radius:999px;z-index:1000}
  </style>
</head>
<body>
  <div class="screen">
    <section id="login" class="login active">
      <div class="card">
        <h1>StreamFlow Pro</h1>
        <p>Accedé a tu panel de gestión</p>
        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="correo@ejemplo.com" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="pass">Contraseña</label>
            <input id="pass" type="password" placeholder="contraseña" autocomplete="current-password" required>
          </div>
          <button class="btn" type="submit">Iniciar sesión</button>
        </form>
      </div>
    </section>

    <section id="app" class="app">
      <div class="topbar">
        <div class="brand">StreamFlow <span style="color:#f5af19">Pro</span></div>
        <div class="badge">DEMO</div>
      </div>
      <div class="content">
        <div id="dashboard" class="panel active">
          <div class="grid">
            <div class="stat"><div class="k">Total Perfiles</div><div class="v" id="sTotal">0</div></div>
            <div class="stat"><div class="k">Libres</div><div class="v" id="sFree">0</div></div>
            <div class="stat"><div class="k">Vencen pronto</div><div class="v" id="sSoon">0</div></div>
            <div class="stat"><div class="k">Ventas Hoy</div><div class="v" id="sSales">0</div></div>
          </div>
          <div class="box"><div class="k">Total Ganado</div><div class="v" id="sEarned">$0</div></div>
        </div>
        <div id="cargar" class="panel"><div class="box"><strong>Cargar</strong><p>Sección lista.</p></div></div>
        <div id="perfiles" class="panel"><div class="box"><strong>Perfiles</strong><p>Sin perfiles cargados.</p></div></div>
        <div id="micuenta" class="panel"><div class="box"><strong>Mi Cuenta</strong><p>Panel de cuenta listo.</p><button id="logout" class="btn secondary" style="margin-top:12px">Cerrar sesión</button></div></div>
      </div>
      <nav id="nav" class="nav">
        <button data-tab="dashboard" class="active">Inicio</button>
        <button data-tab="cargar">Cargar</button>
        <button data-tab="perfiles">Perfiles</button>
        <button data-tab="micuenta">Cuenta</button>
      </nav>
    </section>
  </div>

  <script>
    const login = document.getElementById('login');
    const app = document.getElementById('app');
    const nav = document.getElementById('nav');
    const toast = (m)=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
    function showApp(){login.classList.remove('active');app.classList.add('active');nav.style.display='flex'}
    function showLogin(){app.classList.remove('active');nav.style.display='none';login.classList.add('active')}
    document.getElementById('loginForm').addEventListener('submit', e=>{e.preventDefault();showApp();toast('Bienvenido')})
    document.getElementById('logout').addEventListener('click', ()=>{showLogin();toast('Sesión cerrada')})
    nav.querySelectorAll('button').forEach(btn=>btn.addEventListener('click', ()=>{nav.querySelectorAll('button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(btn.dataset.tab).classList.add('active')}))
  </script>
</body>
</html>
