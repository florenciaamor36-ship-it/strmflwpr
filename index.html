<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0f0c29">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StreamFlow Pro">
  <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f5af19'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='%23000'%3E🎬%3C/text%3E%3C/svg%3E">
  <title>StreamFlow Pro | Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  
  <!-- Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <link rel="stylesheet" href="ZAPIA.css">
</head>
<body class="bg-main text-white">

  <!-- Auth Protection Script -->
  <script>
    const firebaseConfigIndex = {
        apiKey: "AIzaSyB8jYiHFiD_-MTHUQr2c3WU_b84RAPonvA",
        authDomain: "stream-flow-pro.firebaseapp.com",
        projectId: "stream-flow-pro",
        storageBucket: "stream-flow-pro.firebasestorage.app",
        messagingSenderId: "837367317965",
        appId: "1:837367317965:web:00f039846e2a3646d87084"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfigIndex);
    
    firebase.auth().onAuthStateChanged(user => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        document.body.style.display = 'block';
      }
    });
  </script>

  <div id="loaderOverlay" class="loader-overlay"><div class="loader-spinner"></div><div class="loader-text">Nexus IA</div></div>

  <div class="app-container" style="padding-bottom: 80px;">
    <header class="header">
      <div class="header-content">
        <div class="user-info">
          <div class="avatar" id="userAvatar">U</div>
          <div>
            <h2 id="welcomeName" class="neon-text">Hola, Usuario</h2>
            <p id="currentPlan" style="font-size:0.6rem; opacity:0.7;">Plan Activo</p>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="btnNotif"><i class="fas fa-bell"></i></button>
          <button class="icon-btn" id="btnConfig"><i class="fas fa-cog"></i></button>
        </div>
      </div>
    </header>

    <main class="main-content">
        <!-- Content from original index.html will be loaded here by app.js -->
        <div id="dashboard-content">
            <!-- Stats, Lists, etc -->
        </div>
    </main>

    <nav class="nav-bar">
      <div class="nav-item active" data-tab="dashboard"><i class="fas fa-chart-pie"></i><span>Dashboard</span></div>
      <div class="nav-item" data-tab="cuentas"><i class="fas fa-tv"></i><span>Cuentas</span></div>
      <div class="nav-item" data-tab="ventas"><i class="fas fa-shopping-cart"></i><span>Ventas</span></div>
      <div class="nav-item" data-tab="clientes"><i class="fas fa-users"></i><span>Clientes</span></div>
      <div class="nav-item" data-tab="micuenta"><i class="fas fa-user-circle"></i><span>Perfil</span></div>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
