name: CLEAN HTML DEPLOY
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy only index.html
        run: |
          mkdir public
          # Try both names just in case
          if [ -f 'index (8).html' ]; then
            cp 'index (8).html' public/index.html
          elif [ -f 'index.html' ]; then
            cp 'index.html' public/index.html
          fi
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
