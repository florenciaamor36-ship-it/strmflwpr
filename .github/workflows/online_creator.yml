name: Online File Creator
on:
  workflow_dispatch:
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create File
        run: |
          echo "Action Worked" > success.txt
          git config --local user.email "florenciaamor36@gmail.com"
          git config --local user.name "Zapia AI"
          git add success.txt
          git commit -m "Add success.txt"
          git push
