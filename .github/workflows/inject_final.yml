name: INJECT FINAL
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - name: Inject script
        runs: |
          sed -i 's|</body>|<script src="admin-gate.js"></script>\n</body>|' index.html
          git config user.name "Gate Bot"
          git config user.email "gate@zapia.com"
          git add index.html
          git commit -m "Security Gate Injected" || exit 0
          git push