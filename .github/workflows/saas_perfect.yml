name: SaaS Final Activation
on: workflow_dispatch
permissions: 
  contents: write
jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - name: Patch with Python
        run: |
          python3 -c "file_path = 'index.html'; import os; with open(file_path, 'r', encoding='utf-8') as f: content = f.read(); content = content.replace('</head>', '  <link rel=\"stylesheet\" href=\"admin.css\">\\n</head>', 1) if 'admin.css' not in content else content; content = content.replace('</body>', '<script src=\"admin.js\"></script>\\n</body>', 1) if 'admin.js' not in content else content; with open(file_path, 'w', encoding='utf-8') as f: f.write(content)"
      - name: Commit and Push
        run: |
          git config --global user.name "Zapia Assistant"
          git config --global user.email "assistant@zapia.com"
          git add index.html
          git commit -m "Full SaaU UI Activation" || exit 0
          git push