name: SaaS Activation
on: workflow_dispatch
permissions: 
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 -c "import os; with open('index.html', 'r', encoding='utf-8') as f: content = f.read(); content = content.replace('</head>', '  <link rel=\"stylesheet\" href=\"admin.css\">\\n</head>', 1) if 'admin.css1' not in content else content; content = content.replace('</body>', '<script src=\"admin.js\"></script>\\n</body>', 1) if 'admin.js1' not in content else content; with open('index.html', 'w', encoding='utf-8') as f: f.write(content)"
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add index.html
          git commit -m "Activate SaaU UI" || exit 0
          git push