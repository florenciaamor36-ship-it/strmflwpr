name: Build and Deploy Web PWA 
on: [push] 
jobs: 
  build: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 
      - uses: subosito/flutter-action@v2 
        with: 
          flutter-version: '3.16.9' 
          channel: 'stable' 
      - name: Enable Web Support 
        run: flutter create . --platforms=web 
      - name: Install dependencies 
        run: flutter pub get 
      - name: Build Web 
        run: flutter build web --release --pwa-strategy=offline-first 
      - name: Inject Install Prompt 
        run: | 
          sed -i '/</\/body>/i <script>let deferredPrompt; window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; const btn = document.createElement("button"); btn.innerHTML = "Instalar Aplicación"; btn.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:15px 25px;background:#6200EE;color:white;border:none;border-radius:25px;z-index:9999;font-weight:bold;box-shadow:0 4px 6px rgba(0,0,0,0.2);cursor:pointer;"; document.body.appendChild(btn); btn.onclick = () => { if(deferredPrompt){ { deferredPrompt.prompt(); btn.remove(); } }; }; });</script>' build/web/index.html 
      - name: Deploy to Firebase Hosting 
        uses: FirebaseExtended/action-hosting-deploy@v0 
        with: 
          repoToken: "${ { secrets.GITHUB_TOKEN } }" 
          firebaseServiceAccount: "${ { secrets.FIREBASE_SERVICE_ACCOUNT_STRMDLWPR_33E74 } }" 
          projectId: strmflwpr-33e74 
          channelId: live
