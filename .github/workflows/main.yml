name: Build APK and Web PWA
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          flutter create . --platforms=web
          flutter build web --release --pwa-strategy=offline-first
          # Inject PWA install prompt
          sed -i '/<\/body>/i <script>let deferredPrompt; window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; const btn = document.createElement("button"); btn.innerHTML = "Instalar Aplicación"; btn.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:15px 25px;background:#6200EE;color:white;border:none;border-radius:25px;z-index:9999;font-weight:bold;box-shadow:0 4px 6px rgba(0,0,0,0.2);cursor:pointer;"; document.body.appendChild(btn); btn.onclick = () => { if(deferredPrompt){ deferredPrompt.prompt(); btn.remove(); } }; });</script>' build/web/index.html

      - name: Build APK
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_STRMFLWPR_33E74 }}"
          projectId: strmflwpr-33e74
          channelId: live
