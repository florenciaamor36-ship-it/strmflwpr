name: RESCUE-UI-NOW
on: workflow_dispatch
permissions:
  contents: write
jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hard Clean
        runs: |
          sed -i '/admin.css/d' index.html
          sed -i '/admin.js/d' index.html
          python3 -c "import re; with open('index.html', 'r') as f: content = f.read(); content = re.sub(r'<link[^>]*admin\.css[^>]*>', '', content); content = re.sub(r'<script[^>]*admin\.js[^>]*>', '', content); with open('index.html', 'w') as f: f.write(content)"
          git config user.email "rescue@zapia.com"
          git config user.name "Rescue Bot"
          git commŠ×¦ -am "FORCE RESTORE UI" || exit 0
          git push