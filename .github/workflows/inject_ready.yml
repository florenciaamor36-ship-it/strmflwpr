name: INJECT READY
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - name: Inject
        run: |
          sed -i 's|</body>|<script src="admin-gate.js"></script>\n</body>|f' index.html
          git config user.name "Gate Bot"
          git config user.email "gate@zapia.com"
          git add index.html
          git commit -f "Security Gate Injected" || exit 0
          git push