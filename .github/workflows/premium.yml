name: Full Premium Update
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Apply All Patches
        run: |
          cat << 'EOF' > full_patch.py
          import os
          with open('index.html', 'r', encoding='utf-8') as f:
              lines = f.readlines()
          
          # CSS
          css = """
    /* OPTIMIZACIÓN TV */
    @media (min-width: 1200px) {
      html { font-size: 22px; }
      .app-container { max-width: 1200px; }
      .bottom-nav-bar { height: 100px; padding-bottom: 20px; }
      .nav-btn i { font-size: 2rem; }
      .card { margin-bottom: 2rem; padding: 2rem; }
    }
    /* ZAPIA AI CHAT */
    .zapia-chat-bubble {
      position: fixed; bottom: 80px; right: 20px;
      width: 50px; height: 50px; border-radius: 50%;
      background: linear-gradient(145deg, #f5af19, #f12711);
      color: white; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 15px rgba(241, 39, 17, 0.4);
      cursor: pointer; z-index: 1000; transition: transform 0.3s;
      border: 2px solid rgba(255,255,255,0.2);
    }
    .zapia-chat-bubble i { font-size: 1.5rem; }
    .zapia-chat-window {
      position: fixed; bottom: 140px; right: 20px;
      width: 320px; height: 450px; background: #0f0c29;
      border: 1px solid rgba(245, 175, 25, 0.3);
      border-radius: 1.5rem; z-index: 1001; display: none;
      flex-direction: column; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }
    .zapia-chat-header {
      padding: 1rem; background: linear-gradient(145deg, #f5af19, #f12711);
      display: flex; align-items: center; justify-content: space-between;
    }
    .zapia-chat-body { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.8rem; }
    .zapia-msg { padding: 0.7rem 1rem; border-radius: 1rem; font-size: 0.8rem; max-width: 85%; }
    .zapia-msg.bot { background: rgba(255,255,255,0.1); align-self: flex-start; color: #fff; border-bottom-left-radius: 0.2rem; }
    .zapia-msg.user { background: #f5af19; align-self: flex-end; color: #000; font-weight: 600; border-bottom-right-radius: 0.2rem; }
    .zapia-chat-footer { padding: 0.8rem; display: flex; gap: 5px; border-top: 1px solid rgba(255,255,255,0.1); }
    .zapia-chat-input {
      flex: 1; background: rgba(255,255,255,0.05); border: none; border-radius: 1rem;
      padding: 0.5rem 1rem; color: #fff; font-size: 0.8rem; outline: none;
    }
    .zapia-chat-send { background: #f5af19; color: #000; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; }
"""
          for i, line in enumerate(lines):
              if "</style>" in line:
                  lines.insert(i, css)
                  break

          # HTML
          banner = '        <div id="appAnnouncement" class="card" style="display:none; border:1px solid #f5af19; background:rgba(245,175,25,0.05); margin-bottom:1rem; position:relative; overflow:hidden;"><div style="position:absolute; top:0; left:0; width:4px; height:100%; background:#f5af19;"></div><div style="display:flex; align-items:center; gap:10px;"><i class="fas fa-bullhorn" style="color:#f5af19; font-size:1.2rem;"></i><div id="announcementContent" style="font-size:0.85rem; font-weight:600; line-height:1.4;"></div></div></div>\n'
          for i, line in enumerate(lines):
              if "id=\"tab-dashboard\"" in line:
                  lines.insert(i+1, banner)
                  break

          chat_html = """
  <div class="zapia-chat-bubble" id="zapiaBubble"><i class="fas fa-robot"></i></div>
  <div class="zapia-chat-window" id="zapiaChatWindow">
    <div class="zapia-chat-header">
      <div style="display:flex; align-items:center; gap:8px;"><i class="fas fa-robot"></i><span style="font-weight:700; font-size:0.9rem;">Zapia AI</span></div>
      <i class="fas fa-times" id="closeChat" style="cursor:pointer;"></i>
    </div>
    <div class="zapia-chat-body" id="zapiaChatBody"><div class="zapia-msg bot">¡Hola! Soy Zapia. 😊 ¿En qué puedo ayudarte hoy?</div></div>
    <div class="zapia-chat-footer"><input type="text" class="zapia-chat-input" id="zapiaChatInput" placeholder="Duda..."><button class="zapia-chat-send" id="zapiaSendBtn"><i class="fas fa-paper-plane"></i></button></div>
  </div>
"""
          for i, line in enumerate(lines):
              if "</body>" in line:
                  lines.insert(i, chat_html)
                  break

          # JS
          js = """
    (function(){
      const bubble = document.getElementById('zapiaBubble');
      const win = document.getElementById('zapiaChatWindow');
      if(!bubble) return;
      bubble.onclick = () => { win.style.display='flex'; bubble.style.display='none'; };
      document.getElementById('closeChat').onclick = () => { win.style.display='none'; bubble.style.display='flex'; };
      const inp = document.getElementById('zapiaChatInput');
      const body = document.getElementById('zapiaChatBody');
      const send = () => {
        const t = inp.value.trim(); if(!t) return;
        const m = (txt, cl) => { const d=document.createElement('div'); d.className='zapia-msg '+cl; d.innerText=txt; body.appendChild(d); body.scrollTop=body.scrollHeight; };
        m(t, 'user'); inp.value='';
        setTimeout(() => {
          let r = "No sé, pero Flor te ayuda por WhatsApp.";
          const l = t.toLowerCase();
          if(l.includes("pago") || l.includes("prex")) r = "Podés pagar por Prex en 'Mi Cuenta' (alias: ultralinkpagos.ar)";
          else if(l.includes("vence")) r = "Fijate tus días en 'Mi Cuenta'.";
          else if(l.includes("hola")) r = "¡Hola! ¿Cómo estás hoy?";
          m(r, 'bot');
        }, 800);
      };
      document.getElementById('zapiaSendBtn').onclick = send;
      inp.onkeypress = (e) => { if(e.key==='Enter') send(); };
    })();
    async function loadAppAnnouncement() {
      try {
        const d = await db.collection('config').doc('announcement').get();
        if (d.exists && d.data().text) {
          document.getElementById('appAnnouncement').style.display = 'block';
          document.getElementById('announcementContent').innerText = d.data().text;
        }
      } catch(e) {}
    }
"""
          for i, line in enumerate(lines):
              if "// ============ FUNCIONES UTILITARIAS ============" in line:
                  lines.insert(i, js)
                  break

          for i, line in enumerate(lines):
              if "currentUser = user;" in line:
                  lines.insert(i+1, "        db.collection('usuarios').doc(user.uid).update({ lastLogin: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});\n")
                  lines.insert(i+2, "        loadAppAnnouncement();\n")
                  break

          with open('index.html', 'w', encoding='utf-8') as f:
              f.writelines(lines)
          EOF
          python3 full_patch.py
      - name: Commit
        run: |
          git config --local user.email "florenciaamor36@gmail.com"
          git config --local user.name "Zapia AI"
          git add index.html
          git commit -m "Full Update: Premium + AI Chat"
          git push
