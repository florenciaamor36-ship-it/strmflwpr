    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i 's|</body>|<script src="admin-gate.js"></script></body>|' index.html
          git config user.name "Z"
          git config user.email "z@z.com"
          git commit -am "Gate"
          git push